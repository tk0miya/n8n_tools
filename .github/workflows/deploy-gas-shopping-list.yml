name: Deploy shopping_list to GAS

on:
  push:
    branches: [main]
    paths:
      - "gas/shopping_list/src/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
        working-directory: gas
      - name: Build
        run: npm run build:shopping_list
        working-directory: gas
      - name: Create clasp configuration
        run: printenv CLASP_JSON > .clasp.json
        working-directory: gas/shopping_list
        env:
          CLASP_JSON: ${{ secrets.CLASP_JSON_SHOPPING_LIST }}
      - name: Create clasp credentials
        run: printenv CLASPRC_JSON > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      - name: Push to GAS
        run: npx clasp push
        working-directory: gas/shopping_list
      - name: Update deployment
        run: npx clasp deploy --deploymentId "$CLASP_DEPLOY_ID"
        working-directory: gas/shopping_list
        env:
          CLASP_DEPLOY_ID: ${{ secrets.CLASP_DEPLOY_ID_SHOPPING_LIST }}
      - name: Cleanup credentials
        if: always()
        run: rm -f gas/shopping_list/.clasp.json ~/.clasprc.json
